<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Arbab Naseer</title>
  <desc id="d">Software engineer, mobile. React Native and Flutter. Works remotely with the Stadioss team in France, takes freelance work, and maintains his own apps and open-source packages.</desc>
  <defs>
    <linearGradient id="panel" x1="28" y1="22" x2="1180" y2="398" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C1017"/>
      <stop offset="0.55" stop-color="#0A0D13"/>
      <stop offset="1" stop-color="#08090E"/>
    </linearGradient>
    <linearGradient id="card" x1="812" y1="96" x2="1218" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1119"/>
      <stop offset="1" stop-color="#090C11"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8E3D8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8E3D8" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#E8E3D8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="wash" cx="0.24" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#1C2634" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0A0D13" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D9A441" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="28" y="22" width="1224" height="376" rx="22"/></clipPath>
    <style>
      .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
      .disp { font-family: Georgia, "Iowan Old Style", "Times New Roman", "Times", serif; }
      @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
      @keyframes blink { 0%,48%{opacity:1} 49%,100%{opacity:0} }
      @keyframes sweep { 0%{transform:translateX(-420px)} 100%{transform:translateX(1320px)} }
      @keyframes rise { 0%{opacity:0; transform:translateY(6px)} 100%{opacity:1; transform:translateY(0)} }
      @keyframes draw { 0%{transform:scaleX(0)} 100%{transform:scaleX(1)} }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      .sheen { animation: sweep 14s linear infinite; }
      .ln { opacity: 0; animation: rise .45s cubic-bezier(.2,.7,.2,1) forwards; }
      .l1 { animation-delay: .35s; } .l2 { animation-delay: .75s; } .l3 { animation-delay: 1.15s; }
      .l4 { animation-delay: 1.55s; } .l5 { animation-delay: 1.95s; } .l6 { animation-delay: 2.45s; }
      .rule { transform-origin: 834px 0; transform: scaleX(0); animation: draw .8s cubic-bezier(.2,.7,.2,1) 2.8s forwards; }
      .l7 { animation-delay: 3.1s; }
      @media (prefers-reduced-motion: reduce) {
        .ln, .rule { opacity: 1; transform: none; animation: none; }
        .sheen, .pulse, .caret { animation: none; }
      }
    </style>
  </defs>

  <rect width="1280" height="420" fill="#08090C"/>
  <rect x="28" y="22" width="1224" height="376" rx="22" fill="url(#panel)" stroke="#171E29"/>

  <g clip-path="url(#clip)">
    <rect x="28" y="22" width="1224" height="376" fill="url(#wash)"/>
    <g opacity="0.6" stroke="#101722">
      <path d="M182 22V398M342 22V398M502 22V398M662 22V398M822 22V398M982 22V398M1142 22V398"/>
      <path d="M28 138H1252M28 254H1252"/>
    </g>
    <ellipse cx="300" cy="185" rx="260" ry="150" fill="url(#halo)"/>
    <rect class="sheen" x="-420" y="22" width="300" height="376" fill="url(#sheen)"/>
  </g>

  <!-- window bar -->
  <circle cx="62" cy="50" r="6" fill="#C4553D"/>
  <circle cx="82" cy="50" r="6" fill="#D9A441"/>
  <circle cx="102" cy="50" r="6" fill="#3FB68B"/>
  <text class="m" x="128" y="55" font-size="13" fill="#8A6E38">arbab</text>
  <text class="m" x="182" y="55" font-size="13" fill="#3A424E">~/shipping</text>
  <text class="m" x="1218" y="55" font-size="13" fill="#3A424E" text-anchor="end">PK · UTC+5 · remote</text>
  <line x1="62" y1="74" x2="1218" y2="74" stroke="#141B25"/>

  <!-- left column -->
  <text class="m" x="63" y="114" font-size="12" letter-spacing="3.2" fill="#6B7581">SOFTWARE ENGINEER · MOBILE</text>
  <text class="disp" x="60" y="182" font-size="60" font-weight="700" fill="#EAE5DA">Arbab Naseer</text>
  <text class="m" x="63" y="216" font-size="16" fill="#D9A441">i build mobile apps that ship.</text>
  <text class="m" x="63" y="244" font-size="13.5" fill="#78828F">react native · flutter · next.js · node · aws · since 2022</text>

  <g transform="translate(62 266)">
    <rect width="318" height="30" rx="15" fill="#0C1620" stroke="#1E3A31"/>
    <circle class="pulse" cx="19" cy="15" r="4.5" fill="#3FB68B"/>
    <text class="m" x="34" y="19.5" font-size="13" fill="#8FDCBB">available · freelance and full-time</text>
  </g>

  <g transform="translate(62 318)" class="m" font-size="12.5" fill="#C6CBD2">
    <rect width="120" height="30" rx="8" fill="#0C1017" stroke="#1D2632"/>
    <circle cx="15" cy="15" r="3.8" fill="#79A7D8"/><text x="26" y="19.5">React Native</text>
    <rect x="130" width="62" height="30" rx="8" fill="#0C1017" stroke="#1D2632"/>
    <circle cx="145" cy="15" r="3.8" fill="#C6CBD2"/><text x="156" y="19.5">Expo</text>
    <rect x="202" width="86" height="30" rx="8" fill="#0C1017" stroke="#1D2632"/>
    <circle cx="217" cy="15" r="3.8" fill="#79A7D8"/><text x="228" y="19.5">Flutter</text>
    <rect x="298" width="108" height="30" rx="8" fill="#0C1017" stroke="#1D2632"/>
    <circle cx="313" cy="15" r="3.8" fill="#54C79A"/><text x="324" y="19.5">TypeScript</text>
    <rect x="416" width="86" height="30" rx="8" fill="#0C1017" stroke="#1D2632"/>
    <circle cx="431" cy="15" r="3.8" fill="#EBBB5A"/><text x="442" y="19.5">Next.js</text>
  </g>

  <!-- shipping log -->
  <g class="m">
    <rect x="812" y="96" width="406" height="264" rx="18" fill="url(#card)" stroke="#182130"/>
    <text x="834" y="129" font-size="12.5" fill="#59636F">$ cat shipped.log</text>
    <circle class="pulse" cx="1163" cy="124.5" r="3.5" fill="#3FB68B"/>
    <text x="1177" y="129" font-size="11.5" fill="#59636F">live</text>
    <line x1="834" y1="143" x2="1196" y2="143" stroke="#141C26"/>

    <g font-size="13">
      <g class="ln l1"><text x="834" y="172" fill="#3FB68B">✓</text><text x="854" y="172" fill="#C6CBD2">stadioss</text><text x="1196" y="172" fill="#5E6874" text-anchor="end" font-size="12">App Store · team</text></g>
      <g class="ln l2"><text x="834" y="200" fill="#3FB68B">✓</text><text x="854" y="200" fill="#C6CBD2">tryonit sdk</text><text x="1196" y="200" fill="#5E6874" text-anchor="end" font-size="12">4 packages on npm</text></g>
      <g class="ln l3"><text x="834" y="228" fill="#3FB68B">✓</text><text x="854" y="228" fill="#C6CBD2">pocketpos</text><text x="1196" y="228" fill="#5E6874" text-anchor="end" font-size="12">Google Play · web</text></g>
      <g class="ln l4"><text x="834" y="256" fill="#3FB68B">✓</text><text x="854" y="256" fill="#C6CBD2">bitcyclub</text><text x="1196" y="256" fill="#5E6874" text-anchor="end" font-size="12">Flutter → RN · client</text></g>
      <g class="ln l5"><text x="834" y="284" fill="#3FB68B">✓</text><text x="854" y="284" fill="#C6CBD2">quickimagetotext</text><text x="1196" y="284" fill="#5E6874" text-anchor="end" font-size="12">live · 8 languages</text></g>
      <g class="ln l6"><text x="834" y="312" fill="#D9A441">›</text><text x="854" y="312" fill="#D9A441">next build: yours</text><rect class="caret" x="996" y="301" width="8" height="14" fill="#D9A441"/></g>
    </g>

    <line class="rule" x1="834" y1="328" x2="1196" y2="328" stroke="#1A2330"/>
    <g class="ln l7" font-size="12">
      <text x="834" y="347" fill="#D9A441">17 projects</text>
      <text x="940" y="347" fill="#3FB68B">5 npm packages</text>
      <text x="1196" y="347" fill="#7FA8D8" text-anchor="end">4+ years</text>
    </g>
  </g>

  <path d="M42 38H56M42 38V52" stroke="#2A3546" stroke-width="1.5" opacity="0.7"/>
  <path d="M1238 382H1224M1238 382V368" stroke="#2A3546" stroke-width="1.5" opacity="0.7"/>
</svg>
