<svg width="1280" height="196" viewBox="0 0 1280 196" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="st">
  <title id="st">By the numbers: 4+ years building production apps, 17 projects shipped, 5 open-source packages on npm, 5 companies worked with.</title>
  <defs>
    <linearGradient id="sp" x1="28" y1="18" x2="1180" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C1017"/><stop offset="0.55" stop-color="#0A0D13"/><stop offset="1" stop-color="#08090E"/>
    </linearGradient>
    <linearGradient id="sgold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B9863A"/><stop offset="1" stop-color="#EBBB5A"/></linearGradient>
    <linearGradient id="sgreen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2E8A68"/><stop offset="1" stop-color="#54C79A"/></linearGradient>
    <linearGradient id="sclay" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A5432F"/><stop offset="1" stop-color="#D46A50"/></linearGradient>
    <linearGradient id="sblue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4E7BA8"/><stop offset="1" stop-color="#7FA8D8"/></linearGradient>
    <linearGradient id="sglint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EBBB5A" stop-opacity="0"/><stop offset="0.5" stop-color="#EBBB5A" stop-opacity="0.9"/><stop offset="1" stop-color="#EBBB5A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sw" cx="0.5" cy="0.2" r="0.8"><stop offset="0" stop-color="#1B2634" stop-opacity="0.6"/><stop offset="1" stop-color="#0A0D13" stop-opacity="0"/></radialGradient>
    <clipPath id="sc"><rect x="28" y="18" width="1224" height="160" rx="20"/></clipPath>
    <style>
      .m{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
      .d{font-family:Georgia,"Times New Roman",serif}
      @keyframes sslide{0%{transform:translateX(-260px)}100%{transform:translateX(1250px)}}
      @keyframes sdot{0%,100%{opacity:.3}50%{opacity:1}}
      @keyframes srise{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
      .sglint{animation:sslide 9s linear infinite}
      .sdot{animation:sdot 2.4s ease-in-out infinite}
      .col{opacity:0;animation:srise .6s cubic-bezier(.2,.7,.2,1) forwards}
      .c1{animation-delay:.1s}.c2{animation-delay:.25s}.c3{animation-delay:.4s}.c4{animation-delay:.55s}
      @media (prefers-reduced-motion: reduce){.col{opacity:1;animation:none}.sglint,.sdot{animation:none}}
    </style>
  </defs>

  <rect x="28" y="18" width="1224" height="160" rx="20" fill="url(#sp)" stroke="#171E29"/>
  <g clip-path="url(#sc)"><rect x="28" y="18" width="1224" height="160" fill="url(#sw)"/></g>

  <line x1="334" y1="52" x2="334" y2="144" stroke="#182130"/>
  <line x1="640" y1="52" x2="640" y2="144" stroke="#182130"/>
  <line x1="946" y1="52" x2="946" y2="144" stroke="#182130"/>

  <g class="col c1">
    <text class="d" x="181" y="92" font-size="50" font-weight="700" fill="#EBBB5A" text-anchor="middle">4+</text>
    <rect x="151" y="104" width="60" height="3" rx="1.5" fill="url(#sgold)"><animate attributeName="width" values="0;60" dur="0.9s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.1 0.2 1" keyTimes="0;1"/><animate attributeName="x" values="181;151" dur="0.9s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.1 0.2 1" keyTimes="0;1"/></rect>
    <text class="m" x="181" y="128" font-size="14" fill="#E8E3D8" text-anchor="middle">years in production</text>
    <text class="m" x="181" y="148" font-size="11.5" fill="#6E7883" text-anchor="middle">shipping since 2022</text>
  </g>

  <g class="col c2">
    <text class="d" x="487" y="92" font-size="50" font-weight="700" fill="#54C79A" text-anchor="middle">17</text>
    <rect x="457" y="104" width="60" height="3" rx="1.5" fill="url(#sgreen)"><animate attributeName="width" values="0;60" dur="0.9s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.1 0.2 1" keyTimes="0;1"/><animate attributeName="x" values="487;457" dur="0.9s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.1 0.2 1" keyTimes="0;1"/></rect>
    <text class="m" x="487" y="128" font-size="14" fill="#E8E3D8" text-anchor="middle">projects shipped</text>
    <text class="m" x="487" y="148" font-size="11.5" fill="#6E7883" text-anchor="middle">client, team and my own</text>
  </g>

  <g class="col c3">
    <text class="d" x="793" y="92" font-size="50" font-weight="700" fill="#7FA8D8" text-anchor="middle">5</text>
    <rect x="763" y="104" width="60" height="3" rx="1.5" fill="url(#sblue)"><animate attributeName="width" values="0;60" dur="0.9s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.1 0.2 1" keyTimes="0;1"/><animate attributeName="x" values="793;763" dur="0.9s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.1 0.2 1" keyTimes="0;1"/></rect>
    <text class="m" x="793" y="128" font-size="14" fill="#E8E3D8" text-anchor="middle">packages on npm</text>
    <text class="m" x="793" y="148" font-size="11.5" fill="#6E7883" text-anchor="middle">tryonit + rn-onboarding-slides</text>
  </g>

  <g class="col c4">
    <text class="d" x="1099" y="92" font-size="50" font-weight="700" fill="#D46A50" text-anchor="middle">5</text>
    <rect x="1069" y="104" width="60" height="3" rx="1.5" fill="url(#sclay)"><animate attributeName="width" values="0;60" dur="0.9s" begin="0.75s" fill="freeze" calcMode="spline" keySplines="0.2 0.1 0.2 1" keyTimes="0;1"/><animate attributeName="x" values="1099;1069" dur="0.9s" begin="0.75s" fill="freeze" calcMode="spline" keySplines="0.2 0.1 0.2 1" keyTimes="0;1"/></rect>
    <text class="m" x="1099" y="128" font-size="14" fill="#E8E3D8" text-anchor="middle">teams worked with</text>
    <text class="m" x="1099" y="148" font-size="11.5" fill="#6E7883" text-anchor="middle">agencies, startups, products</text>
  </g>

  <line x1="28" y1="171" x2="1252" y2="171" stroke="#141B25"/>
  <g clip-path="url(#sc)"><rect class="sglint" x="-260" y="170.2" width="260" height="1.8" fill="url(#sglint)"/></g>
  <circle class="sdot" cx="46" cy="34" r="3" fill="#3FB68B"/>
  <text class="m" x="58" y="38" font-size="11" fill="#4A5460">by the numbers</text>
</svg>
